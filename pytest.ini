[pytest]
# pytest設定ファイル

# テストディレクトリ
testpaths = tests

# テストファイルのパターン
python_files = test_*.py

# テストクラスのパターン
python_classes = Test*

# テスト関数のパターン
python_functions = test_*

# 詳細な出力
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# マーカー定義
markers =
    unit: ユニットテスト
    integration: 統合テスト
    slow: 実行に時間がかかるテスト
    db: データベーステスト
    api: 外部APIテスト
    mcp: MCPテスト

# カバレッジ設定（オプション）
# --cov=src
# --cov-report=html
# --cov-report=term-missing

# 並列実行の設定（pytest-xdist使用時）
# -n auto

# エンコーディング設定
# pythonpath = .
