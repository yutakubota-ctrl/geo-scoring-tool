# GEOスコアリングツール 評価プロンプト設定

# 認知スコア評価プロンプト
visibility_prompt: |
  以下のAI回答を分析し、指定ブランドが言及されているか判定してください。

  【AI回答】
  {response}

  【対象ブランド】
  {brand_name}

  【関連キーワード】
  {keywords}

  【判定基準】
  - ブランド名が直接言及されている: 言及あり
  - ブランドの製品名やサービス名が言及されている: 言及あり
  - 関連キーワードが文脈的にブランドを示している: 言及あり
  - 上記のいずれにも該当しない: 言及なし

  【出力形式】JSON
  {{
    "mentioned": true または false,
    "evidence": "言及箇所の引用（言及ありの場合）",
    "confidence": 0から100の数値
  }}

# 推奨度・感情スコア評価プロンプト
sentiment_prompt: |
  以下のAI回答における、指定ブランドへの推奨度と感情を分析してください。

  【AI回答】
  {response}

  【対象ブランド】
  {brand_name}

  【評価基準】
  - 強い推奨（「おすすめ」「最適」「最良の選択」など）: 30点
  - 中程度の推奨（「良い選択肢」「検討価値あり」など）: 20点
  - 弱い推奨（「選択肢の一つ」「条件次第」など）: 10点
  - 中立（単なる列挙、説明のみ）: 0点
  - 軽い否定（「課題あり」「注意が必要」など）: -5点
  - 強い否定（「避けるべき」「問題が多い」など）: -10点

  【出力形式】JSON
  {{
    "score": -10から30の整数,
    "sentiment_type": "strong_positive/positive/neutral/negative/strong_negative のいずれか",
    "key_phrases": ["感情を示すフレーズのリスト"],
    "reasoning": "判定理由"
  }}

# 掲載ポジションスコア評価プロンプト
positioning_prompt: |
  以下のAI回答で、指定ブランドがどの位置で言及されているか分析してください。

  【AI回答】
  {response}

  【対象ブランド】
  {brand_name}

  【評価基準】
  - 最初に言及（冒頭から最初の1/4）: 20点
  - 早期に言及（1/4から1/2の位置）: 15点
  - 中盤で言及（1/2から3/4の位置）: 10点
  - 後半で言及（3/4から末尾）: 5点
  - 言及なし: 0点

  【出力形式】JSON
  {{
    "score": 0から20の整数,
    "position_ratio": 0.0から1.0の小数（先頭からの相対位置）,
    "context": "言及された文脈の要約"
  }}

# 情報正確性スコア評価プロンプト
accuracy_prompt: |
  以下のAI回答に含まれる、指定ブランドに関する情報の正確性を評価してください。

  【AI回答】
  {response}

  【対象ブランド】
  {brand_name}

  【参照情報（正しい情報）】
  {reference_facts}

  【評価基準】各項目10点、合計最大40点
  1. 製品・サービス名の正確性（0-10点）
  2. 機能・特徴の正確性（0-10点）
  3. 価格・プランの正確性（0-10点）
  4. その他の事実情報の正確性（0-10点）

  【出力形式】JSON
  {{
    "total_score": 0から40の整数,
    "breakdown": {{
      "product_accuracy": 0から10の整数,
      "feature_accuracy": 0から10の整数,
      "pricing_accuracy": 0から10の整数,
      "other_accuracy": 0から10の整数
    }},
    "correct_claims": ["正確な記述のリスト"],
    "incorrect_claims": ["不正確な記述とその訂正"],
    "unverifiable_claims": ["検証できない記述"]
  }}

# 監視プロンプトのカテゴリ定義
prompt_categories:
  comparison:
    name: "比較・検討"
    description: "複数の選択肢を比較検討する質問"
    templates:
      - "{category}ツールでおすすめの会社を5つ教えて。それぞれのメリット・デメリットも"
      - "{category}サービスを比較して、選び方のポイントを教えて"
      - "{category}で人気のサービスをランキング形式で教えて"

  problem_solving:
    name: "課題解決"
    description: "特定の課題を解決するための質問"
    templates:
      - "{category}のコストを削減したい。どんなアプローチやサービスがある？"
      - "{category}の効率を上げる方法を教えて"
      - "{category}で困っている。解決策を提案して"

  reputation:
    name: "指名・評判"
    description: "特定ブランドの評判を尋ねる質問"
    templates:
      - "{brand_name}の評判や、導入に向いている企業の特徴は？"
      - "{brand_name}を使っている企業の口コミを教えて"
      - "{brand_name}のメリットとデメリットを教えて"
